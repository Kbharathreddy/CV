paths:
  data_root: data
  output_root: outputs
  colmap_executable: colmap
  gaussian_splatting_path: null

dataset:
  name: mipnerf360
  scene: bonsai

video:
  frame_interval: 10
  time_interval: null
  target_frames: null

quality:
  # Initial configurable defaults, not experimentally proven optima.
  blur_threshold: 100.0
  min_brightness: 30.0
  max_brightness: 225.0
  dark_intensity_cutoff: 30
  bright_intensity_cutoff: 225
  max_dark_pixel_ratio: 0.45
  max_bright_pixel_ratio: 0.45
  minimum_feature_count: 40

frame_selection:
  method: automatic
  feature_detector: orb
  maximum_features: 3000
  redundancy_threshold: 0.85
  minimum_matches: 50
  lowe_ratio: 0.75
  use_geometric_check: true
  ransac_reprojection_threshold: 3.0
  max_redundant_motion: 0.015

preprocessing:
  max_width: 1600
  max_height: 1200
  jpeg_quality: 95

colmap:
  backend: auto
  matcher: auto
  dataset_matcher: exhaustive
  video_matcher: sequential
  camera_model: PINHOLE
  image_subdir: images_4
  single_camera: true
  sequential_overlap: 10

gaussian:
  iterations: 30000
  lambda_ssim: 0.2
  device: cuda
  checkpoint_interval: 7000
  implementation:
    name: graphdeco-inria/gaussian-splatting
    repository_url: https://github.com/graphdeco-inria/gaussian-splatting.git
    commit: 54c035f7834b564019656c3e3fcc3646292f727d
    license: Non-commercial research/evaluation license from Inria and MPII
  smoke_test:
    iterations: 300
    images_subdir: images
    output_subdir: outputs/kaggle/bonsai_smoke

evaluation:
  psnr: true
  ssim: true
  lpips: true

reproducibility:
  random_seed: 42
