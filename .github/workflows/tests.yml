name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML Pillow numpy "opencv-python>=4.8,<5"

      - name: Import checks
        run: |
          python -c "import src.config, src.convert_colmap, src.download_dataset, src.evaluation, src.extract_frames, src.frame_quality, src.frame_selection, src.gaussian_splatting, src.phase5_experiments, src.phase5_results, src.preprocess, src.pipeline, src.run_colmap, src.utils"

      - name: Run tests
        run: pytest
